# Test database provided by GitHub Actions
spring.datasource.url=jdbc:postgresql://localhost:5432/hotelapp_test
spring.datasource.username=postgres
spring.datasource.password=postgres

# Liquibase changelog location
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml

# JWT config for tests (dummy values, not used in real auth)
hotel.app.jwtSecret=testSecretKeyForCIOnlyNotUsedInProductionAtAll123456
hotel.app.jwtExpirationMs=86400000

# Disable SQL logging in tests
spring.jpa.show-sql=false
