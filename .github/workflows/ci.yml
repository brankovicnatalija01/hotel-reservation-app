name: CI Pipeline

on:
  pull_request:
    branches:
      - main
      - develop

jobs:

  # ── Job 1: Checkstyle + Tests + Coverage + SonarCloud ────────────────────
  test-and-analyze:
    name: Test, Coverage & SonarCloud
    runs-on: ubuntu-latest

    services:
      # Start a real PostgreSQL container for integration tests
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hotelapp_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4.7.0
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        working-directory: backend
        run: ./mvnw checkstyle:check --no-transfer-progress

      - name: OWASP Dependency Vulnerability Scan
        working-directory: backend
        run: |
            ./mvnw org.owasp:dependency-check-maven:check \
              -DfailBuildOnCVSS=7 \
              --no-transfer-progress
          continue-on-error: true

      - name: Run Tests with Coverage
        working-directory: backend
        env:
          SPRING_PROFILES_ACTIVE: test
        run: ./mvnw verify --no-transfer-progress

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: jacoco-coverage-report
          path: backend/target/site/jacoco/
          retention-days: 7

      - name: SonarCloud Analysis
        working-directory: backend
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }} \
            -Dsonar.organization=${{ secrets.SONAR_ORGANIZATION }} \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml \
            --no-transfer-progress

  # ── Job 2: Docker Build & Push (runs only if Job 1 passes) ───────────────
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test-and-analyze
    strategy:
      matrix:
        include:
          - service: backend
            context: ./backend
          - service: frontend
            context: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Log in to Docker Hub
        uses: docker/login-action@v3.4.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for Docker tags
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/hotelapp-${{ matrix.service }}
          tags: |
            type=ref,event=pr
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.15.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}